<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore - Product Details</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><i class="fas fa-bag-shopping"></i> MyStore</div>
    <form class="nav-search">
      <input type="text" placeholder="Search products...">
      <button type="submit" aria-label="Search"><i class="fas fa-magnifying-glass"></i></button>
    </form>
    <button class="nav-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
    <div class="nav-links">
      <a href="index.html"><i class="fas fa-house"></i> Home</a>
      <a href="products.html"><i class="fas fa-box-open"></i> Products</a>
      <a href="about.html"><i class="fas fa-circle-info"></i> About</a>
      <a href="cart.html"><i class="fas fa-cart-shopping"></i> Cart <span class="cart-count">0</span></a>
      <a href="login.html"><i class="fas fa-user"></i> Login</a>
    </div>
  </div>

  <div class="details-container">
    <img id="productImage" src="" alt="Product">
    <div class="details-info">
      <span class="category-tag" id="productCategory"></span>
      <h1 id="productName"></h1>
      <div class="price" id="productPrice"></div>
      <p id="productDesc"></p>
      <button class="add-btn" id="addBtn" style="width: 220px;">
        <i class="fas fa-cart-plus"></i> Add to Cart
      </button>
      <br>
      <a href="products.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Products</a>
    </div>
  </div>

  <footer>
    © 2026 MyStore. All rights reserved.
  </footer>

  <script src="js/store.js"></script>
  <script src="js/products.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
