<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore - Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><i class="fas fa-bag-shopping"></i> MyStore</div>
    <form class="nav-search">
      <input type="text" placeholder="Search products...">
      <button type="submit" aria-label="Search"><i class="fas fa-magnifying-glass"></i></button>
    </form>
    <button class="nav-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
    <div class="nav-links">
      <a href="index.html"><i class="fas fa-house"></i> Home</a>
      <a href="products.html"><i class="fas fa-box-open"></i> Products</a>
      <a href="about.html"><i class="fas fa-circle-info"></i> About</a>
      <a href="cart.html"><i class="fas fa-cart-shopping"></i> Cart <span class="cart-count">0</span></a>
      <a href="login.html"><i class="fas fa-user"></i> Login</a>
    </div>
  </div>

  <div class="cart-container">
    <h2><i class="fas fa-cart-shopping"></i> Your Cart</h2>

    <table id="cartTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cartBody"></tbody>
    </table>

    <div class="empty-state" id="cartEmpty" style="display:none;">
      <i class="fas fa-cart-shopping"></i>
      <p>Your cart is empty.</p>
      <a href="products.html" class="btn" style="background:#161B45;color:#fff;margin-top:10px;">
        <i class="fas fa-bag-shopping"></i> Browse Products
      </a>
    </div>

    <div class="cart-summary" id="cartSummaryBox">
      <div class="total">
        <div class="total-label">Total</div>
        <div class="total-amount" id="cartTotal">$0.00</div>
        <button class="btn checkout-btn"><i class="fas fa-lock"></i> Checkout</button>
      </div>
    </div>
  </div>

  <footer>
    © 2026 MyStore. All rights reserved.
  </footer>

  <script src="js/store.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
