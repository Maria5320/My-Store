<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><i class="fas fa-bag-shopping"></i> MyStore</div>
    <form class="nav-search">
      <input type="text" placeholder="Search products...">
      <button type="submit" aria-label="Search"><i class="fas fa-magnifying-glass"></i></button>
    </form>
    <button class="nav-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
    <div class="nav-links">
      <a href="index.html"><i class="fas fa-house"></i> Home</a>
      <a href="products.html"><i class="fas fa-box-open"></i> Products</a>
      <a href="about.html"><i class="fas fa-circle-info"></i> About</a>
      <a href="cart.html"><i class="fas fa-cart-shopping"></i> Cart <span class="cart-count">0</span></a>
      <a href="login.html"><i class="fas fa-user"></i> Login</a>
    </div>
  </div>

  <div class="auth-box">
    <i class="fas fa-user-lock"></i>
    <h2>Welcome Back</h2>
    <p class="subtext">Login to continue shopping</p>

    <div class="input-group">
      <i class="fas fa-envelope"></i>
      <input type="email" id="email" placeholder="Enter email">
    </div>
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <button class="btn" onclick="login()"><i class="fas fa-right-to-bracket"></i> Login</button>

    <p class="auth-hint">Don't have an account? <a href="#" style="color:#161B45; font-weight:600;">Sign up</a></p>
  </div>

  <script src="js/store.js"></script>
  
  <script src="js/login.js"></script>
</body>
</html>
