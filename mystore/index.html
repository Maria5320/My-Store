<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStore - Home</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><i class="fas fa-bag-shopping"></i> MyStore</div>
    <form class="nav-search">
      <input type="text" placeholder="Search products...">
      <button type="submit" aria-label="Search"><i class="fas fa-magnifying-glass"></i></button>
    </form>
    <button class="nav-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
    <div class="nav-links">
      <a href="index.html"><i class="fas fa-house"></i> Home</a>
      <a href="products.html"><i class="fas fa-box-open"></i> Products</a>
      <a href="about.html"><i class="fas fa-circle-info"></i> About</a>
      <a href="cart.html"><i class="fas fa-cart-shopping"></i> Cart <span class="cart-count">0</span></a>
      <a href="login.html"><i class="fas fa-user"></i> Login</a>
    </div>
  </div>

  <div class="hero">
    <div class="hero-text">
      <h1>SHOP THE BEST PRODUCTS</h1>
      <p>Find everything you need in one place.</p>
      <a href="products.html" class="btn"><i class="fas fa-bag-shopping"></i> Shop Now</a>
    </div>
  </div>

  <div class="features">
    <div class="feature">
      <i class="fas fa-truck"></i>
      <p>Free Shipping</p>
    </div>
    <div class="feature">
      <i class="fas fa-rotate-left"></i>
      <p>Money Back</p>
    </div>
    <div class="feature">
      <i class="fas fa-lock"></i>
      <p>Secure Payment</p>
    </div>
    <div class="feature">
      <i class="fas fa-headset"></i>
      <p>24/7 Support</p>
    </div>
  </div>

  <h2 class="section-title">Featured Products</h2>

  <div class="products" id="productsContainer"></div>

  <footer>
    © 2026 MyStore. All rights reserved.
  </footer>

  <script src="js/store.js"></script>
  <script src="js/products.js"></script>
  <script src="js/home.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      let container = document.getElementById("productsContainer");
      container.innerHTML = products.slice(0, 4).map(productCardHTML).join("");
    });
  </script>
</body>
</html>
